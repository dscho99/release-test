name: milestone-created

# 사람이 마일스톤을 만들면 Mattermost 로 알린다.
#
# 주의: 롤오버 워크플로가 GITHUB_TOKEN 으로 만든 마일스톤은 여기로 오지 않는다.
# GITHUB_TOKEN 으로 발생한 이벤트는 새 워크플로 실행을 만들지 않는 게 Actions
# 사양이라서다. 그쪽은 scripts/rollover.sh 가 직접 발송한다.
on:
  milestone:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    # 사내 Mattermost 는 사내망에서만 열려 있어서, GitHub 호스티드 러너에서는
    # 이 스텝이 항상 timeout 으로 실패한다. 사내 러너를 붙이면 이 줄만
    # self-hosted 로 바꾸면 되고 스크립트는 그대로다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mattermost 알림
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TITLE: ${{ github.event.milestone.title }}
          URL: ${{ github.event.milestone.html_url }}
          DUE_ON: ${{ github.event.milestone.due_on }}
        run: |
          text="**[${TITLE}](${URL})** 마일스톤이 생성되었습니다. 이슈를 추가해 주세요."
          if [[ -n "${DUE_ON}" ]]; then
            text="${text}"$'\n'"마감: ${DUE_ON%%T*} 17:00 KST"
          fi
          # 발송 실패로 실행을 빨갛게 만들지 않는다. 망이 막혀 있는 동안 마일스톤을
          # 만들 때마다 실패 알림이 오면 사람들이 그냥 무시하게 된다. 대신 경고로
          # 남겨서 Actions 화면에서는 계속 보이게 한다.
          if ! ./scripts/mattermost.sh "$text"; then
            echo "::warning title=Mattermost 발송 실패::러너에서 사내 Mattermost 에 닿지 못했다. 메시지: ${text%%$'\n'*}"
          fi
